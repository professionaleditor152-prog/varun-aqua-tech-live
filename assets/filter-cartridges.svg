<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%">
  <defs>
    <linearGradient id="spunGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8F1F5" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D0E3ED" />
    </linearGradient>
    <linearGradient id="memWrap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0877C9" />
      <stop offset="40%" stop-color="#13C5D8" />
      <stop offset="100%" stop-color="#054A7E" />
    </linearGradient>
  </defs>

  <!-- 1. Spun Sediment Candle -->
  <g transform="translate(30, 20)">
    <rect x="0" y="20" width="70" height="180" rx="8" fill="url(#spunGrad)" stroke="#B8D3E0" stroke-width="1.5"/>
    <line x1="8" y1="50" x2="62" y2="50" stroke="#D0E3ED" stroke-width="1"/>
    <line x1="8" y1="90" x2="62" y2="90" stroke="#D0E3ED" stroke-width="1"/>
    <line x1="8" y1="130" x2="62" y2="130" stroke="#D0E3ED" stroke-width="1"/>
    <line x1="8" y1="170" x2="62" y2="170" stroke="#D0E3ED" stroke-width="1"/>
    <circle cx="35" cy="10" r="8" fill="#A0B8C8"/>
    <circle cx="35" cy="210" r="8" fill="#A0B8C8"/>
    <text x="35" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#061B33" text-anchor="middle">Spun Polypropylene</text>
    <text x="35" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#4A5E73" text-anchor="middle">5 Micron Pre-Filter</text>
  </g>

  <!-- 2. Carbon Block Cartridge -->
  <g transform="translate(140, 20)">
    <rect x="0" y="20" width="70" height="180" rx="8" fill="#243447" stroke="#061B33" stroke-width="1.5"/>
    <!-- Netting Texture -->
    <path d="M10 30 L60 80 M10 80 L60 130 M10 130 L60 180" stroke="#4A5E73" stroke-width="1.2" opacity="0.6"/>
    <path d="M60 30 L10 80 M60 80 L10 130 M60 130 L10 180" stroke="#4A5E73" stroke-width="1.2" opacity="0.6"/>
    <circle cx="35" cy="10" r="8" fill="#0877C9"/>
    <circle cx="35" cy="210" r="8" fill="#0877C9"/>
    <text x="35" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#061B33" text-anchor="middle">Carbon Block CTO</text>
    <text x="35" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#4A5E73" text-anchor="middle">Adsorbs Chlorine/Odour</text>
  </g>

  <!-- 3. RO Membrane (75 / 80 / 100 GPD) -->
  <g transform="translate(250, 20)">
    <rect x="0" y="24" width="76" height="172" rx="10" fill="url(#memWrap)" stroke="#0877C9" stroke-width="1.8"/>
    <!-- Seal Rings -->
    <rect x="6" y="44" width="64" height="20" rx="4" fill="#061B33" opacity="0.4"/>
    <rect x="6" y="152" width="64" height="20" rx="4" fill="#061B33" opacity="0.4"/>
    <!-- Central Pure Water Tube -->
    <rect x="30" y="4" width="16" height="20" rx="3" fill="#FFFFFF" stroke="#0877C9" stroke-width="1"/>
    <rect x="30" y="196" width="16" height="20" rx="3" fill="#FFFFFF" stroke="#0877C9" stroke-width="1"/>
    <text x="38" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">RO</text>
    <text x="38" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#38E1F2" text-anchor="middle">MEMBRANE</text>
    <text x="38" y="136" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#D9ECF5" text-anchor="middle">0.0001 Micron</text>
    <text x="38" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#061B33" text-anchor="middle">Thin-Film RO Leaf</text>
    <text x="38" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#4A5E73" text-anchor="middle">High TDS Reduction</text>
  </g>

  <!-- 4. Post-Carbon / Alkaline Mineralizer Inline -->
  <g transform="translate(370, 45)">
    <rect x="0" y="15" width="140" height="50" rx="25" fill="#FFFFFF" stroke="#13C5D8" stroke-width="2"/>
    <circle cx="20" cy="40" r="10" fill="#EAF3FA"/>
    <circle cx="120" cy="40" r="10" fill="#EAF3FA"/>
    <text x="70" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#061B33" text-anchor="middle">MINERAL / POST-CARBON</text>
    <text x="70" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#0877C9" text-anchor="middle">pH &amp; Essential Minerals</text>

    <!-- RO Booster Pump Unit -->
    <rect x="10" y="85" width="120" height="60" rx="8" fill="#102033" stroke="#0877C9" stroke-width="1.5"/>
    <circle cx="36" cy="115" r="16" fill="#0877C9"/>
    <text x="80" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">BOOSTER PUMP</text>
    <text x="80" y="126" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#13C5D8">24V / 36V / 48V DC</text>
    <text x="70" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#061B33" text-anchor="middle">Inline System Spares</text>
    <text x="70" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#4A5E73" text-anchor="middle">Genuine Components</text>
  </g>
</svg>