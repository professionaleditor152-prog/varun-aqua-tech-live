<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F0F7FB" />
      <stop offset="100%" stop-color="#D9ECF5" />
    </linearGradient>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E1F7FC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0877C9" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13C5D8" />
      <stop offset="100%" stop-color="#0877C9" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#13C5D8" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#061B33" flood-opacity="0.12" />
    </filter>
    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Decorative Purity Rings -->
  <circle cx="300" cy="270" r="220" fill="none" stroke="#E1EDF2" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="300" cy="270" r="170" fill="none" stroke="#13C5D8" stroke-width="1" opacity="0.3"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="300" cy="240" r="130" fill="url(#accentGlow)" opacity="0.08" filter="url(#glowLight)"/>

  <!-- RO Purifier Main Chassis -->
  <g filter="url(#softShadow)">
    <!-- Base Cabinet -->
    <rect x="180" y="80" width="240" height="360" rx="28" fill="url(#bodyGrad)" stroke="#C8DFEB" stroke-width="2"/>
    
    <!-- Top Display Header -->
    <path d="M180 108 C180 92.5 192.5 80 208 80 L392 80 C407.5 80 420 92.5 420 108 L420 160 L180 160 Z" fill="#061B33"/>
    
    <!-- Status LED & Digital Screen -->
    <rect x="230" y="102" width="140" height="36" rx="8" fill="#0B2545" stroke="#13C5D8" stroke-width="1.2"/>
    <circle cx="248" cy="120" r="4" fill="#00E5FF"/>
    <text x="260" y="124" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">PURIFYING</text>
    <circle cx="352" cy="120" r="3" fill="#13C5D8"/>
    
    <!-- LED Indicators: Power, Purify, Tank Full -->
    <circle cx="210" cy="120" r="3.5" fill="#00E5FF"/>
    <circle cx="390" cy="120" r="3.5" fill="#38E1F2"/>

    <!-- Transparent Storage Tank Panel -->
    <rect x="204" y="176" width="192" height="190" rx="16" fill="url(#tankGrad)" stroke="#B3DAE8" stroke-width="1.5"/>
    
    <!-- Pure Water Level in Tank -->
    <path d="M205 240 Q252 232 300 240 T395 240 L395 350 C395 359 387 365 378 365 L222 365 C213 365 205 359 205 350 Z" fill="url(#waterGrad)" opacity="0.6"/>
    
    <!-- Water Level Ripple Line -->
    <path d="M205 240 Q252 232 300 240 T395 240" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>

    <!-- Purification Membrane View Window Indicator -->
    <rect x="270" y="192" width="60" height="16" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <text x="278" y="204" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="800" fill="#0877C9">RO + UV</text>

    <!-- Chrome Dispenser Tap / Faucet -->
    <rect x="290" y="380" width="20" height="24" rx="4" fill="#A0B8C8"/>
    <path d="M300 404 L300 422" stroke="#7A94A8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="300" cy="428" r="4.5" fill="#13C5D8"/>

    <!-- Stream of Pure Water -->
    <line x1="300" y1="428" x2="300" y2="465" stroke="#13C5D8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Pure Water Glass Floating Beside Purifier -->
  <g transform="translate(265, 450)" filter="url(#softShadow)">
    <path d="M20 0 L50 0 L45 42 C44 46 40 48 35 48 L35 48 C30 48 26 46 25 42 Z" fill="#E1F7FC" stroke="#0877C9" stroke-width="1.5" opacity="0.85"/>
    <path d="M23 16 L47 16 L44 40 C43 43 40 45 35 45 C30 45 27 43 26 40 Z" fill="url(#waterGrad)" opacity="0.8"/>
    <ellipse cx="35" cy="16" rx="12" ry="3" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- Floating Quality Badges -->
  <!-- Left Badge: 15+ Years Exp & 5000+ Services Trusted -->
  <g transform="translate(45, 175)" filter="url(#softShadow)">
    <rect width="180" height="66" rx="14" fill="#FFFFFF" stroke="#0877C9" stroke-width="1.8"/>
    <circle cx="34" cy="33" r="16" fill="#E8F9FB"/>
    <text x="34" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0877C9" text-anchor="middle">15+</text>
    <text x="60" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#061B33">Years Experience</text>
    <text x="60" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#0877C9">5,000+ Services Trusted</text>
  </g>

  <!-- Right Badge: Doorstep Support Dharmapuri -->
  <g transform="translate(390, 290)" filter="url(#softShadow)">
    <rect width="170" height="66" rx="14" fill="#FFFFFF" stroke="#E1EDF2" stroke-width="1.5"/>
    <circle cx="34" cy="33" r="16" fill="#061B33"/>
    <!-- Technician / Spanner Wrench Icon -->
    <path d="M30 29 L38 37 M35 26 A4 4 0 0 1 39 30 L37 32 L33 28 Z" fill="none" stroke="#13C5D8" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#061B33">Doorstep Service</text>
    <text x="60" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#0877C9">Dharmapuri &amp; Surrounds</text>
  </g>

  <!-- Lower Left Badge: Free Installation -->
  <g transform="translate(50, 330)" filter="url(#softShadow)">
    <rect width="185" height="64" rx="14" fill="#FFFFFF" stroke="#13C5D8" stroke-width="1.8"/>
    <circle cx="32" cy="32" r="16" fill="#E8F9FB"/>
    <path d="M26 32 L30 36 L38 28" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#061B33">Free Installation</text>
    <text x="56" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#0877C9">On New RO Purifiers</text>
  </g>
</svg>