<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="skidSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A5E73" />
      <stop offset="50%" stop-color="#7A94A8" />
      <stop offset="100%" stop-color="#334658" />
    </linearGradient>
    <linearGradient id="vesselGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0877C9" />
      <stop offset="40%" stop-color="#1E9BE8" />
      <stop offset="100%" stop-color="#065492" />
    </linearGradient>
    <linearGradient id="membraneSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E1EDF2" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#B8D3E0" />
    </linearGradient>
  </defs>

  <!-- Industrial Skid Frame -->
  <rect x="60" y="360" width="480" height="24" rx="4" fill="url(#skidSteel)" />
  <rect x="90" y="240" width="16" height="120" fill="url(#skidSteel)" />
  <rect x="494" y="240" width="16" height="120" fill="url(#skidSteel)" />

  <!-- Dual FRP Pre-treatment Media Vessels (Sand & Carbon) -->
  <g transform="translate(90, 80)">
    <rect x="0" y="30" width="80" height="230" rx="40" fill="url(#vesselGrad)" />
    <!-- Top Multiport Valve -->
    <rect x="25" y="6" width="30" height="26" rx="4" fill="#102033" />
    <path d="M40 0 L40 8" stroke="#13C5D8" stroke-width="4" />
    <text x="40" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">MEDIA</text>
    <text x="40" y="166" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#B3DAE8" text-anchor="middle">SAND FILTER</text>
  </g>

  <g transform="translate(190, 80)">
    <rect x="0" y="30" width="80" height="230" rx="40" fill="url(#vesselGrad)" />
    <rect x="25" y="6" width="30" height="26" rx="4" fill="#102033" />
    <path d="M40 0 L40 8" stroke="#13C5D8" stroke-width="4" />
    <text x="40" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">ACTIVATED</text>
    <text x="40" y="166" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#B3DAE8" text-anchor="middle">CARBON</text>
  </g>

  <!-- Stainless Steel High Pressure RO Membrane Housings (Horizontal Array) -->
  <g transform="translate(290, 110)">
    <!-- Tube 1 -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="url(#membraneSteel)" stroke="#0877C9" stroke-width="1.5" />
    <rect x="18" y="5" width="184" height="24" rx="4" fill="#D9ECF5" opacity="0.5" />
    <text x="110" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#061B33" text-anchor="middle">RO MEMBRANE 4040/8040</text>
    
    <!-- Tube 2 -->
    <rect x="0" y="48" width="220" height="34" rx="17" fill="url(#membraneSteel)" stroke="#0877C9" stroke-width="1.5" />
    <rect x="18" y="53" width="184" height="24" rx="4" fill="#D9ECF5" opacity="0.5" />
    <text x="110" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#061B33" text-anchor="middle">HIGH PRESSURE STAGE</text>
  </g>

  <!-- Vertical High Pressure Pump -->
  <g transform="translate(300, 220)">
    <rect x="10" y="30" width="36" height="110" rx="6" fill="#102033" stroke="#0877C9" stroke-width="2"/>
    <!-- Motor Fins -->
    <line x1="8" y1="50" x2="48" y2="50" stroke="#4A5E73" stroke-width="2"/>
    <line x1="8" y1="65" x2="48" y2="65" stroke="#4A5E73" stroke-width="2"/>
    <line x1="8" y1="80" x2="48" y2="80" stroke="#4A5E73" stroke-width="2"/>
    <line x1="8" y1="95" x2="48" y2="95" stroke="#4A5E73" stroke-width="2"/>
    <circle cx="28" cy="20" r="14" fill="#0877C9" />
  </g>

  <!-- Control Panel & Flow Rotameters -->
  <g transform="translate(370, 210)">
    <rect x="0" y="0" width="140" height="130" rx="10" fill="#061B33" stroke="#13C5D8" stroke-width="2"/>
    <!-- Digital Gauges -->
    <circle cx="36" cy="36" r="18" fill="#0B2545" stroke="#13C5D8" stroke-width="1.5"/>
    <line x1="36" y1="36" x2="44" y2="28" stroke="#13C5D8" stroke-width="2"/>
    <text x="36" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#FFFFFF" text-anchor="middle">PRESSURE</text>

    <circle cx="104" cy="36" r="18" fill="#0B2545" stroke="#38E1F2" stroke-width="1.5"/>
    <line x1="104" y1="36" x2="98" y2="28" stroke="#38E1F2" stroke-width="2"/>
    <text x="104" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#FFFFFF" text-anchor="middle">FLOW RATE</text>

    <!-- Indicators -->
    <rect x="20" y="80" width="100" height="32" rx="6" fill="#0B2545" stroke="#4A5E73" stroke-width="1"/>
    <circle cx="36" cy="96" r="5" fill="#00E5FF"/>
    <circle cx="56" cy="96" r="5" fill="#13C5D8"/>
    <text x="88" y="99" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">AUTO TDS</text>
  </g>

  <!-- Stainless Interconnecting Piping -->
  <path d="M170 110 L190 110 M270 110 L290 110" stroke="#7A94A8" stroke-width="6" stroke-linecap="round"/>
</svg>